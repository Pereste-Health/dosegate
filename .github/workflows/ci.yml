name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the proofs
        run: lake build DoseGate.Proofs
      - name: Build the binaries
        run: lake build dosegate dosegate-baseline
      - name: No sorry or native_decide
        run: |
          ! grep -rnw --include=*.lean -e sorry -e native_decide DoseGate Main.lean Baseline.lean
          lake env lean tests/Axioms.lean > axioms.txt
          ! grep -q sorryAx axioms.txt
      - name: Regression tests
        run: bash tests/run.sh
      - name: Reader fuzz test
        run: python3 tests/fuzz_reader.py --core v2 --seed 7 --count 5000
